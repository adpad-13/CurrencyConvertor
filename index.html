<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Currency Converter</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard">
        <h1>Currency Converter</h1>

        <div class="input-group">
            <label for="input-amt">Enter amount</label>
            <input id="input-amt" type="number" placeholder="100" required>
        </div>

        <div class="dropdown-row">
            <div class="select-box">
                <img id="from-flag" class="flag-img" src="" alt="Flag">
                <select id="from-curr"></select>
            </div>

            <span id="seperator">TO</span>

            <div class="select-box">
                <img id="to-flag" class="flag-img" src="" alt="Flag">
                <select id="to-curr"></select>
            </div>
        </div>

        <button id="convert">Convert</button>

        <p id="result"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
