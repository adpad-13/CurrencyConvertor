<!DOCTYPE html>
<html lang="end">
<head>
    <meta charset="UTF-8">
    <title>Currency Convertor</title>
</head>

<body>
    <h1>Currency Convertor</h1>
    <div class="dashboard">
        <p>enter the amount<input id="input-amt" type="number" placeholder="100"></p>
        <select id="from-curr" >
            <option value="" disabled selected hidden>USD - United States Dollar</option>
        </select>
        <span id="seperator">To</span>
        <select id="to-curr" >
            <option value="" disabled selected hidden>INR - Indian Rupee</option>
        </select>
        <br>
        <button id="convert">Convert</button>
    </div>
</body>
</html>
